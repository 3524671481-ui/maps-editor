<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #122033;
      --muted: #506176;
      --accent: #0b6bcb;
      --border: #d8e2ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 16px 48px rgba(16, 43, 73, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      display: block;
      padding: 18px 20px;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      background: #fbfdff;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: #b7d2f2;
      box-shadow: 0 10px 24px rgba(11, 107, 203, 0.12);
    }

    small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>Maps Editor</h1>
    <p>选择要打开的页面。这个入口页用于 GitHub Pages 默认首页，方便直接在线运行项目。</p>
    <a href="./map_editor.html">
      打开 Map Editor
      <small>基础地图编辑页面</small>
    </a>
    <a href="./map_editor_place_marker.html">
      打开 Place Marker Editor
      <small>带标记放置功能的页面</small>
    </a>
  </main>
</body>
</html>
